name: validate

# The csvs in data/ are generated from the workbooks, so they can drift from
# datapackage.json without anyone noticing. Check both on every change.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frictionless:
    name: datapackage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install frictionless
      # checks every csv against its declared field types, constraints,
      # primary keys and foreign keys
      - run: frictionless validate datapackage.json

  integrity:
    name: schema and keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::jsonlite
            any::testthat
            any::here
      - run: Rscript scripts/validate.R
      - run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
